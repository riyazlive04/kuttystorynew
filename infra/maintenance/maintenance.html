<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuttyStory — Back soon</title>
<!-- Keep crawlers from caching this as the real homepage. Paired with the
     503 + Retry-After that nginx sends, this keeps the site's rankings intact. -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --cream: #FBF7FE;
    --lilac: #F3E9FB;
    --border: #EBD9F7;
    --plum: #3B2E4A;
    --muted: #8B7E9B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--cream);
    color: var(--plum);
    font-family: "Quicksand", "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .card {
    width: 100%;
    max-width: 520px;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 2rem;
    padding: 44px 36px;
    text-align: center;
    box-shadow: 0 12px 34px -12px rgba(147, 51, 234, 0.25);
  }
  .mark {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.02em;
    background: linear-gradient(120deg, #C026D3 0%, #9333EA 55%, #7C3AED 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .emoji { font-size: 2.75rem; line-height: 1; margin: 22px 0 6px; }
  h1 { font-size: 1.6rem; font-weight: 800; margin: 10px 0 0; }
  p { color: var(--muted); font-size: 1rem; line-height: 1.65; margin: 14px 0 0; }
  .note {
    margin-top: 26px;
    padding: 14px 18px;
    background: var(--lilac);
    border-radius: 1rem;
    font-size: 0.9rem;
    color: var(--plum);
  }
  a { color: #7C3AED; font-weight: 700; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">KuttyStory</div>
    <div class="emoji" role="img" aria-label="Closed book">📖</div>
    <h1>We're taking a short break</h1>
    <p>The story shop is closed for now. Nothing has been lost — every book that
       was already made is safe, and we'll be back before you know it.</p>
    <div class="note">
      Questions about an existing order? Write to
      <!-- TODO: replace with the address you actually want printed publicly. -->
      <a href="mailto:hello@kuttystory.co.in">hello@kuttystory.co.in</a>.
    </div>
  </main>
</body>
</html>
