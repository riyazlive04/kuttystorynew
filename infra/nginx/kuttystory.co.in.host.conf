# Host nginx vhost for KuttyStory on the Hostinger VPS.
#
#   cp infra/nginx/kuttystory.co.in.host.conf /etc/nginx/sites-available/kuttystory
#   nginx -t && systemctl reload nginx
#
# This is the COMPLETE file — it replaces /etc/nginx/sites-available/kuttystory
# wholesale. TLS terminates here; the app runs in Docker bound to loopback
# (see docker-compose.prod.yml).
#
# The api./admin. blocks below are retained deliberately. They point at the
# retired pm2 stack and will 502, but their :80 blocks are required for
# certbot's HTTP-01 challenge: the cert covers all four names and renews as one
# unit, so deleting them breaks renewal for the apex too. To drop them, first
# reissue the cert for just the apex:
#   certbot --nginx -d kuttystory.co.in -d www.kuttystory.co.in --cert-name kuttystory.co.in
#
# Lines marked "managed by Certbot" are rewritten by `certbot renew` — leave them.

server {
    server_name kuttystory.co.in www.kuttystory.co.in;
    client_max_body_size 50M; # child-photo uploads

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # FastAPI. The trailing slash on proxy_pass strips the /api prefix, so the
    # app sees its routers at root (they carry no /api prefix themselves).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Book generation is slow; don't cut it off at the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Generated page images + print PDFs, served by the API container.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Retired pm2 stack — kept only so certbot can renew these names. See note above.
server {
    server_name api.kuttystory.co.in;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name admin.kuttystory.co.in;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kuttystory.co.in www.kuttystory.co.in;
    return 404; # managed by Certbot
}

server {
    if ($host = api.kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.kuttystory.co.in;
    return 404; # managed by Certbot
}

server {
    if ($host = admin.kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.kuttystory.co.in;
    return 404; # managed by Certbot
}
