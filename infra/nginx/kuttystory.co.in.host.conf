# Host nginx vhost for KuttyStory on the Hostinger VPS.
# Install to /etc/nginx/sites-available/kuttystory.co.in and symlink into
# sites-enabled/. TLS is terminated here; the app runs in Docker bound to
# loopback (see docker-compose.prod.yml).
#
# The certbot-managed lines below are copied verbatim from the previous vhost —
# do not hand-edit them; `certbot renew` rewrites them.

server {
    server_name kuttystory.co.in www.kuttystory.co.in;

    client_max_body_size 50M; # child-photo uploads

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # FastAPI. Trailing slash on proxy_pass strips the /api prefix, so the app
    # sees its routes at root.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Book generation is slow; don't cut it off at the default 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Generated media / uploads, served by the API container.
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = kuttystory.co.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name kuttystory.co.in www.kuttystory.co.in;
    return 404; # managed by Certbot
}
