# MAINTENANCE vhost for KuttyStory — serves a 503 holding page instead of the app.
#
#   cp infra/nginx/kuttystory.co.in.maintenance.conf /etc/nginx/sites-available/kuttystory
#   nginx -t && systemctl reload nginx
#
# This is the COMPLETE file — it replaces /etc/nginx/sites-available/kuttystory
# wholesale, exactly like the live vhost it stands in for. To bring the site
# back, copy kuttystory.co.in.host.conf over the same path and reload.
#
# Two things here are load-bearing and must not be "tidied away":
#
#  1. 503 + Retry-After, NOT a 200 page. A 200 tells Google the maintenance
#     page IS the homepage and it will index it, undoing the SEO work in
#     b476a53. A 503 tells crawlers "temporarily unavailable, come back" and
#     rankings survive the outage.
#
#  2. The /.well-known/acme-challenge/ blocks. The :80 blocks 301 everything to
#     https, so certbot's HTTP-01 challenge lands on the :443 block — and if
#     that 503s the challenge path, RENEWAL FAILS and the cert expires while
#     the site is dark. Both blocks below let the challenge through.
#
# The api./admin. blocks are retained for the same reason as in the live file:
# the cert covers all four names and renews as a unit.

server {
    server_name kuttystory.co.in www.kuttystory.co.in;

    # Let certbot renew while the site is down. Must come before the catch-all.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 503;
    }

    error_page 503 @maintenance;

    location @maintenance {
        root /var/www/maintenance;
        rewrite ^.*$ /maintenance.html break;
        # `always` — without it nginx drops these headers on an error response.
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type text/html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Retired pm2 stack — kept only so certbot can renew these names.
server {
    server_name api.kuttystory.co.in;
    location / {
        return 503;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name admin.kuttystory.co.in;
    location / {
        return 503;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kuttystory.co.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kuttystory.co.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name kuttystory.co.in www.kuttystory.co.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name api.kuttystory.co.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name admin.kuttystory.co.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
