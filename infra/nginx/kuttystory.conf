# Production reverse proxy for KuttyStory.
# Serves the Next.js frontend and proxies /api -> FastAPI, /uploads -> storage.
# Terminate TLS here (certbot) or at your load balancer / CDN.

upstream kutty_web {
    server web:3000;
}

upstream kutty_api {
    server api:8000;
}

server {
    listen 80;
    server_name kuttystory.in www.kuttystory.in;

    client_max_body_size 15M; # allow child-photo uploads

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # FastAPI backend
    location /api/ {
        proxy_pass http://kutty_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Generated media / uploads served by the API container
    location /uploads/ {
        proxy_pass http://kutty_api/uploads/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://kutty_web;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://kutty_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
