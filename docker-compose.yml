services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kutty
      POSTGRES_PASSWORD: kutty
      POSTGRES_DB: kuttystory
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutty -d kuttystory"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://kutty:kutty@db:5432/kuttystory
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - api_storage:/app/storage
    command: >
      sh -c "prisma db push --skip-generate || true;
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://kutty:kutty@db:5432/kuttystory
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis
    volumes:
      - ./apps/api:/app
      - api_storage:/app/storage
    command: celery -A app.worker.celery_app worker --beat --loglevel=info

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Production reverse proxy. Enable with:  docker compose --profile prod up
  nginx:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    depends_on:
      - web
      - api
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/kuttystory.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  api_storage:
